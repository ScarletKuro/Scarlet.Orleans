version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      orleans:
        patterns: ["Microsoft.Orleans.*"]
      entity-framework:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql.EntityFrameworkCore*", "Microting.*", "MySql.EntityFrameworkCore"]

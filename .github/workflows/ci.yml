name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

# Every job runs the whole suite. SQLite always runs; a server engine runs where its SCARLET_TEST_* connection string is
# set, and SCARLET_TEST_REQUIRE makes a job fail rather than skip when its own engine is missing.
# Images are pinned by digest and updated deliberately (design section 9.3).
# Jobs with a database server run the test projects one at a time: together they open more connections than the
# servers' defaults allow (100 on PostgreSQL, 151 on MySQL).

jobs:
  build:
    name: Build, pack, SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Scarlet.Orleans.slnx -c $CONFIGURATION
      - run: dotnet test --solution Scarlet.Orleans.slnx -c $CONFIGURATION --no-build
      - run: dotnet pack Scarlet.Orleans.slnx -c $CONFIGURATION --no-build -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.nupkg

  postgresql:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "14"
            image: postgres:14.24@sha256:8ab94f61668dc73bbab4dc13273ff2fc37e635536af62aef5306a49a9682a446
          - version: "16"
            image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
          - version: "17"
            image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: scarlet-test-1
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SCARLET_TEST_POSTGRESQL: Host=localhost;Port=5432;Username=postgres;Password=scarlet-test-1
      SCARLET_TEST_REQUIRE: PostgreSql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --solution Scarlet.Orleans.slnx -c $CONFIGURATION --max-parallel-test-modules 1

  sqlserver:
    name: SQL Server ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2019"
            image: mcr.microsoft.com/mssql/server:2019-latest@sha256:07d7dedecdbfcf6776035dc5eefb5bfd9aa1804b2f6b99f7dedb397d8a599069
          - version: "2022"
            image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    services:
      db:
        image: ${{ matrix.image }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Scarlet-Test-1
        ports: ["1433:1433"]
    env:
      SCARLET_TEST_SQLSERVER: Server=localhost,1433;User ID=sa;Password=Scarlet-Test-1;TrustServerCertificate=True
      SCARLET_TEST_REQUIRE: SqlServer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The images ship different sqlcmd paths across versions, so readiness is read from the server log instead.
      - name: Wait for SQL Server
        run: timeout 120 bash -c 'until docker logs "${{ job.services.db.id }}" 2>&1 | grep -q "SQL Server is now ready for client connections"; do sleep 2; done'
      - run: dotnet test --solution Scarlet.Orleans.slnx -c $CONFIGURATION --max-parallel-test-modules 1

  mysql:
    name: MySQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8.4"
            image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: scarlet-test-1
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pscarlet-test-1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Runs the MySqlConnector and MySql.Data suites, and both MySQL EF Core providers.
      SCARLET_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=scarlet-test-1;AllowPublicKeyRetrieval=True
      SCARLET_TEST_REQUIRE: MySql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --solution Scarlet.Orleans.slnx -c $CONFIGURATION --max-parallel-test-modules 1

  mariadb:
    name: MariaDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "10.6"
            image: mariadb:10.6.28@sha256:88ac718dafee1e8fb415233c04f314f3c3866af99177ce25d436106c62090461
          - version: "11.4"
            image: mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: scarlet-test-1
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SCARLET_TEST_MARIADB: Server=127.0.0.1;Port=3306;User ID=root;Password=scarlet-test-1
      SCARLET_TEST_REQUIRE: MariaDb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --solution Scarlet.Orleans.slnx -c $CONFIGURATION --max-parallel-test-modules 1

  native-aot:
    name: NativeAOT, all engines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ADO.NET suites, published as a native executable and run against every engine at once (design section 4.11).
    # Silo tests are not included: an Orleans 10.4 silo cannot start under NativeAOT.
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scarlet-test-1
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Scarlet-Test-1
        ports: ["1433:1433"]
      mysql:
        image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: scarlet-test-1
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pscarlet-test-1" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
        env:
          MARIADB_ROOT_PASSWORD: scarlet-test-1
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SCARLET_TEST_POSTGRESQL: Host=localhost;Port=5432;Username=postgres;Password=scarlet-test-1
      SCARLET_TEST_SQLSERVER: Server=localhost,1433;User ID=sa;Password=Scarlet-Test-1;TrustServerCertificate=True
      SCARLET_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=scarlet-test-1;AllowPublicKeyRetrieval=True
      SCARLET_TEST_MARIADB: Server=127.0.0.1;Port=3307;User ID=root;Password=scarlet-test-1
      SCARLET_TEST_REQUIRE: PostgreSql,SqlServer,MySql,MariaDb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          dotnet publish test/Persistence/Scarlet.Orleans.Persistence.AdoNet.NativeAotTests -c $CONFIGURATION -r linux-x64 -o artifacts/aot-tests/persistence
          dotnet publish test/Reminders/Scarlet.Orleans.Reminders.AdoNet.NativeAotTests -c $CONFIGURATION -r linux-x64 -o artifacts/aot-tests/reminders
          dotnet publish test/GrainDirectory/Scarlet.Orleans.GrainDirectory.AdoNet.NativeAotTests -c $CONFIGURATION -r linux-x64 -o artifacts/aot-tests/grain-directory
      - name: Wait for SQL Server
        run: timeout 120 bash -c 'until docker logs "${{ job.services.sqlserver.id }}" 2>&1 | grep -q "SQL Server is now ready for client connections"; do sleep 2; done'
      - name: Run persistence
        run: ./artifacts/aot-tests/persistence/Scarlet.Orleans.Persistence.AdoNet.NativeAotTests
      - name: Run reminders
        run: ./artifacts/aot-tests/reminders/Scarlet.Orleans.Reminders.AdoNet.NativeAotTests
      - name: Run grain directory
        run: ./artifacts/aot-tests/grain-directory/Scarlet.Orleans.GrainDirectory.AdoNet.NativeAotTests
